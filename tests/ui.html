<!doctype html>
<meta charset="utf-8">
<title>ThaiLingo — tests d'interface</title>
<style>
 body{font-family:system-ui,sans-serif;padding:24px;max-width:820px;margin:auto}
 li{margin:6px 0} .ok{color:#2e7d32} .ko{color:#c62828}
 iframe{width:420px;height:640px;border:1px solid #ccc;border-radius:8px;margin-top:20px}
 h1{font-size:20px} #sum{font-weight:700;margin-top:14px}
</style>
<h1>Tests d’interface — ThaiLingo</h1>
<p>Les scénarios sont joués dans l’application réelle chargée ci-dessous.</p>
<ul id="out"></ul>
<div id="sum">exécution…</div>
<iframe id="app" src="../index.html"></iframe>
<script>
const out = document.getElementById('out');
let pass=0, fail=0;
const log=(nom,err)=>{ const li=document.createElement('li');
  li.className = err?'ko':'ok'; li.textContent = (err?'✗ ':'✓ ')+nom+(err?' → '+err.message:'');
  out.appendChild(li); err?fail++:pass++; };
const t=async (nom,fn)=>{ try{ await fn(); log(nom); }catch(e){ log(nom,e); } };
const ok=(c,m)=>{ if(!c) throw new Error(m||'condition fausse'); };
const eq=(a,b,m)=>{ if(a!==b) throw new Error((m||'')+`attendu ${JSON.stringify(b)}, reçu ${JSON.stringify(a)}`); };
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* avance jusqu'à un exercice à choix multiples et y répond */
function repondre(F, D, juste){
  while(F.L && F.L.idx < F.L.ex.length && !F.L.ex[F.L.idx].options){ F.L.idx++; F.renderLesson(); }
  if(!F.L || F.L.idx >= F.L.ex.length) return false;
  const e = F.L.ex[F.L.idx];
  const i = juste ? e.options.findIndex(o=>o.correct) : e.options.findIndex(o=>!o.correct);
  D.querySelectorAll('#ch .choice')[i].click();
  D.getElementById('check').click();
  return true;
}

document.getElementById('app').onload = async ()=>{
  const W = document.getElementById('app').contentWindow;
  const F = W.ThaiLingo;
  const D = W.document;
  for(let i=0; i<80 && !D.querySelector('.node[data-lecon]'); i++) await sleep(100);
  /* la synchronisation en ligne est neutralisée pendant les scénarios locaux :
     elle a son propre test, plus bas, qui la rétablit le temps d'un aller-retour */
  const lireEnLigne = F.Nuage.lire;
  F.Nuage.lire = async ()=> null;
  W.localStorage.clear(); F.Store.reset(); F.render(); await sleep(80);

  const PREMIERE = D.querySelector('.node[data-lecon]').dataset.lecon;

  await t('le contenu des trois paliers est chargé', ()=>{
    ok(Object.keys(F.LEX).length >= 450, 'trop peu de mots : '+Object.keys(F.LEX).length);
    eq(D.querySelectorAll('.section-head').length, F.SECTIONS.length);
  });
  await t('le parcours de langue n’affiche pas les unités d’écriture', ()=>{
    F.go('path');
    eq(D.querySelectorAll('.unit-header').length, F.UNITES_LANGUE.length);
    ok(F.UNITES_LANGUE.length < F.CURRICULUM.length, 'écriture non séparée : ');
  });
  await t('l’onglet Écriture contient l’alphabet et les tons', ()=>{
    F.go('ecriture');
    eq(D.querySelectorAll('.unit-header').length, F.UNITES_ECRITURE.length);
    ok(D.querySelectorAll('.node[data-lecon]').length >= 10);
    F.go('path');
  });
  await t('le mode découverte ouvre toutes les leçons, sinon une seule', ()=>{
    F.Store.get().toutDebloque = true; F.go('path');
    const toutes = D.querySelectorAll('.node[data-lecon]').length;
    eq([...D.querySelectorAll('.node[data-lecon]')].filter(b=>!b.disabled).length, toutes);
    F.Store.get().toutDebloque = false; F.go('path');
    eq([...D.querySelectorAll('.node[data-lecon]')].filter(b=>!b.disabled).length, 1);
    F.Store.get().toutDebloque = true; F.go('path');
  });
  await t('changer de cours bascule toute l’interface en anglais', async ()=>{
    F.Store.changerCours('en-th');
    await F.chargerCours('en-th');
    F.render(); await sleep(80);
    ok(/Daily/.test(D.querySelector('.quests h3').textContent), 'interface restée en français : ');
    ok(/Greetings/.test(D.querySelector('.unit-header h2').textContent), 'titres non traduits : ');
    F.Store.changerCours('fr-th');
    await F.chargerCours('fr-th');
    F.render(); await sleep(80);
    ok(/Quêtes/.test(D.querySelector('.quests h3').textContent), 'retour au français raté : ');
  });
  await t('chaque cours garde sa progression', ()=>{
    F.Store.completeLesson(PREMIERE, 10, true);
    eq(F.Store.crowns(PREMIERE), 1);
    F.Store.changerCours('en-th');
    eq(F.Store.crowns(PREMIERE), 0, 'le cours anglais démarre vierge : ');
    F.Store.changerCours('fr-th');
    eq(F.Store.crowns(PREMIERE), 1, 'progression du cours français perdue : ');
    F.Store.reset();
  });
  await t('la barre de navigation est masquée pendant une leçon', ()=>{
    F.startLeconId(PREMIERE);
    ok(D.getElementById('nav').classList.contains('hidden'));
  });
  await t('le bouton Vérifier est inactif tant qu’on n’a pas répondu', ()=>{
    ok(D.getElementById('check').disabled);
  });
  await t('une leçon démarre toujours avec trois vies', ()=>{
    F.Store.loseHeart(); F.startLeconId(PREMIERE);
    eq(F.Store.get().hearts, 3);
  });
  await t('une bonne réponse déclenche le retour vert sans perdre de vie', ()=>{
    const vies = F.Store.get().hearts;
    ok(repondre(F, D, true), 'aucun exercice à choix : ');
    ok(D.getElementById('footer').classList.contains('ok'), 'retour non vert : ');
    eq(F.Store.get().hearts, vies);
  });
  await t('une mauvaise réponse coûte une vie et remet l’exercice en file', ()=>{
    F.startLeconId(PREMIERE);
    const vies = F.Store.get().hearts;
    ok(repondre(F, D, false), 'aucun exercice à choix : ');
    eq(F.Store.get().hearts, vies-1);
    eq(F.L.requeue.length, 1, 'exercice non remis en file : ');
    ok(D.getElementById('footer').classList.contains('ko'));
  });
  await t('trois erreurs font échouer la leçon', ()=>{
    F.startLeconId(PREMIERE);
    for(let i=0; i<3 && F.Store.get().hearts>0; i++){
      ok(repondre(F, D, false), 'plus d’exercice à choix : ');
      const c = D.getElementById('cont'); if(c) c.click();
    }
    eq(F.Store.get().hearts, 0);
    ok(D.body.textContent.includes('Leçon échouée'), 'écran d’échec absent : ');
    D.getElementById('back').click();
    eq(F.Store.get().hearts, 3, 'les vies repartent à trois : ');
  });
  await t('la croix de sortie ouvre une confirmation, sans fenêtre native', ()=>{
    F.startLeconId(PREMIERE);
    D.getElementById('quit').click();
    const modale = D.querySelector('.overlay .modal');
    ok(modale, 'aucune modale de confirmation : ');
    ok(/Quitter/.test(modale.textContent), 'texte inattendu : ');
    [...modale.querySelectorAll('button')].find(b=>/Continuer/.test(b.textContent)).click();
    ok(!D.querySelector('.overlay'), 'la modale ne se referme pas : ');
    F.go('path');
  });
  await t('chaque mot thaï affiché porte sa romanisation', ()=>{
    F.startLeconId(PREMIERE);
    let vus = 0;
    for(let i=0; i<F.L.ex.length; i++){
      F.L.idx = i; F.renderLesson();
      D.querySelectorAll('.tile.empile, .pair.empile, .choice').forEach(el=>{
        const th = el.querySelector('.thai');
        if(th && F.romDe(th.textContent)){ vus++; ok(el.querySelector('.rom'), `« ${th.textContent} » sans romanisation`); }
      });
    }
    ok(vus > 5, 'trop peu de mots thaïs vérifiés : '+vus);
    F.go('path');
  });
  await t('la fin de leçon accorde une couronne et des XP', ()=>{
    F.startLeconId(PREMIERE);
    const xp = F.Store.xp();
    F.L.idx = F.L.ex.length; F.L.requeue = []; F.finish();
    eq(F.Store.crowns(PREMIERE), 1);
    ok(F.Store.xp() > xp);
    ok(D.querySelector('.end h1'), 'écran de fin absent : ');
  });
  await t('le thème sombre s’applique à la racine du document', ()=>{
    F.Store.get().theme='sombre'; F.applyTheme();
    eq(D.documentElement.dataset.appTheme, 'sombre');
    F.Store.get().theme='auto'; F.applyTheme();
  });
  await t('la progression est relue après rechargement', ()=>{
    const brut = W.localStorage.getItem('thailingo.save');
    ok(brut && JSON.parse(brut).cours['fr-th'].progress[PREMIERE].crowns === 1);
  });
  await t('le défi chronométré ne fait pas perdre de vie', ()=>{
    F.go('path'); F.startTimed();
    const vies = F.Store.get().hearts;
    if(repondre(F, D, false)) eq(F.Store.get().hearts, vies);
    W.clearInterval(W.__timer); F.go('path');
  });
  await t('la sauvegarde en ligne fait un aller-retour réel', async ()=>{
    F.Nuage.lire = lireEnLigne;                     // on rétablit la vraie lecture
    const s = await F.Nuage.auth();
    ok(s && s.uid, 'aucune identité obtenue : ');
    F.Store.reset();
    F.Store.completeLesson(PREMIERE, 11, true);
    ok(await F.Nuage.ecrire(F.Store.get()), 'écriture refusée : ');
    const distant = await F.Nuage.lire();
    ok(distant, 'rien relu depuis le serveur : ');
    eq(distant.cours['fr-th'].progress[PREMIERE].crowns, 1);
    ok(await F.Nuage.supprimerCompte(), 'ménage impossible : ');  // on retire l'utilisateur de test
  });
  await t('un lien de sauvegarde rétablit la progression', ()=>{
    F.Store.reset();
    F.Store.completeLesson(PREMIERE, 9, false);
    const code = F.Store.codeSauvegarde();
    F.Store.reset();
    eq(F.Store.crowns(PREMIERE), 0, 'remise à zéro : ');
    eq(F.restaurerDepuisLien('#sauvegarde=' + encodeURIComponent(code), ()=>true, ()=>{}), 'restauré');
    eq(F.Store.crowns(PREMIERE), 1);
  });
  await t('un lien de sauvegarde refusé ne touche à rien', ()=>{
    F.Store.reset();
    eq(F.restaurerDepuisLien('#sauvegarde=peu-importe', ()=>false, ()=>{}), 'refusé');
    eq(F.Store.crowns(PREMIERE), 0);
  });

  document.getElementById('sum').textContent = `${pass} test(s) OK, ${fail} échec(s)`;
  document.getElementById('sum').className = fail ? 'ko' : 'ok';
  window.__result = {pass, fail};
};
</script>
